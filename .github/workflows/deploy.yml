name: Deploy Bot Absen

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-bot-absen
  cancel-in-progress: true

env:
  DEPLOY_PATH: /home/rizal/bot-absen

jobs:
  deploy:
    name: Deploy to Server via Cloudflare Tunnel
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH via Tunnel
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<'EOF'
          Host deploy-target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy & Restart Service
        run: |
          ssh deploy-target "
            set -euo pipefail
            cd $DEPLOY_PATH
            git fetch --depth=1 origin main
            git reset --hard origin/main
            .venv/bin/pip install -q -r requirements.txt
            export XDG_RUNTIME_DIR=/run/user/\$(id -u)
            systemctl --user restart bot-absen.service
            sleep 2
            systemctl --user is-active bot-absen.service
          "

      - name: Notify Success
        if: success()
        run: |
          {
            echo "## Deploy Bot Absen Berhasil"
            echo "Server: \`${{ secrets.SSH_HOST }}\`"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Waktu: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
